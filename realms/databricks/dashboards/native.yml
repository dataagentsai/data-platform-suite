# Generated by realms/databricks/dashboards/generate.py from dataplatform.obs.native. Do not edit.
# Platform-native screens and notifications, adopted, not rebuilt (ADR-024 rule 1, set a).
native:
  jobs_monitoring:
    kind: screen
    how: "deploy unchanged"
    where: "realms/databricks/dashboards/native/lakeflow_job_health.lvdash.json: the platform's Lakeflow job health template, exported as is (imported 4 Nov) and deployed by the dashboards bundle"
    reads: "system.lakeflow.jobs, system.lakeflow.job_run_timeline, system.lakeflow.job_task_run_timeline"
    covers: "Job runs, their duration, result and retries across the workspace, from the platform's job telemetry."
    instead_of: "job-level history and performance; observability keeps per-dataset and per-step time (run log)"
  job_failure_notification:
    kind: notification
    how: "job setting"
    where: "every job: webhook_notifications.on_failure -> ${var.ops_destination_id}; email_notifications.on_failure -> the job's owners"
    reads: "the job's own run events"
    covers: "A message from the platform on a job's failure, to the job's owners' destination."
    instead_of: "a run-failed e-mail of our own; our alerts add routing by tier and the noise rules (OPS-06)"
  lineage_view:
    kind: screen
    how: "link"
    where: "Catalog Explorer > <table> > Lineage"
    reads: "system.access.table_lineage, system.access.column_lineage"
    covers: "Table and column lineage, browsed in the catalog."
    instead_of: "a lineage browser and a table-to-table screen of our own"
  audit_view:
    kind: screen
    how: "link"
    where: "Catalog Explorer > system.access.audit"
    reads: "system.access.audit"
    covers: "Who read or changed what, from the platform's audit log."
    instead_of: "an audit browser of our own"
  table_insights:
    kind: screen
    how: "link"
    where: "Catalog Explorer > <table> > Insights"
    reads: "system.query.history, system.access.audit"
    covers: "Per table: how often it is read, by whom, and the frequent queries and joins, from the platform's query and audit telemetry."
    instead_of: "a usage and adoption screen of our own (dropped 13 Nov)"
  anomaly_detection:
    kind: screen
    how: "enable per schema"
    where: "Catalog Explorer > <schema> > Details > Data quality monitoring; enabled by realms/databricks/dashboards/enable_anomaly_detection.py on the silver and gold schemas"
    reads: "the watched tables' commit history (results in system.data_quality_monitoring)"
    covers: "Per table in a watched schema: freshness and completeness checked against limits learned from the table's own history, with an alert when a table is stale or short."
    instead_of: "learned freshness alerts and a latest-age listing of our own; observability keeps only the contract's promised targets (freshness and SLOs), which the platform cannot know"
# For every generated job (merging into the bundle generator is pending):
job_notifications:
  webhook_notifications:
    on_failure:
      - id: "${var.ops_destination_id}"
  email_notifications:
    on_failure:
      - "${var.ops_owner_email}"
    no_alert_for_skipped_runs: true
