# The W1 engine on Databricks Free Edition: Iceberg tables in Unity Catalog, metadata store on Lakebase. Domain-neutral:
# the catalog slice to run is a job parameter (`slice`, default 02-tyre, or 03-clinical); the world in it picks the
# domain model, the gold models (models/<domain>) and the gold judge.
#
#   rsync -a --delete ~/data-platform-catalog/slices/<slice> _catalog/slices/    # the slice(s) to run, copied in first
#   cd realms/databricks/engine && databricks bundle deploy -p free
#   databricks bundle run engine_probe -p free        # what serverless allows (cache, checkpoint, Iceberg writes)
bundle:
  name: dp_engine

variables:
  env:
    default: dev
  meta_instance:
    default: dp-meta-dev

sync:
  paths:
    - ../../../src/dataplatform
    - ../../../scripts
    - ../../../models            # every domain's gold models; the run picks models/<domain> from the world
    - ../semantic_governance/generated  # the business metric views and their known answers (B12)
    - .                       # includes _catalog/ (the slice(s), copied in before deploy)
  include:
    - _catalog/**             # git-ignored (copies of data-platform-catalog/slices/<slice>), so listed here

targets:
  dev:
    default: true
    mode: development

resources:
  jobs:
    engine_probe:
      name: dp-${var.env}-engine-probe
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - "psycopg[binary]>=3.2"
              - "pyyaml>=6"
      tasks:
        - task_key: probe
          environment_key: default
          spark_python_task:
            python_file: ./tasks/probe.py
            parameters: [--root, "${workspace.file_path}", --meta-instance, "${var.meta_instance}",
                         --schema, "${var.env}_ops.engine_probe", --domain, "tyre"]

    engine_days:
      name: dp-${var.env}-engine-days
      max_concurrent_runs: 1
      parameters:
        - name: slice           # which catalog slice to run (a folder under _catalog/slices/): 02-tyre or 03-clinical
          default: "02-tyre"
        - name: days
          default: "3"
        - name: calendar        # compressed = every planted incident on days 2-3 (the 3-day loop); "" = world's own
          default: "compressed"
        - name: housekeeping_days  # bronze housekeeping's correction window (B8); 1 on the compressed loop; "" = off
          default: "1"
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - "psycopg[binary]>=3.2"
              - "pyyaml>=6"
      tasks:
        - task_key: days
          environment_key: default
          spark_python_task:
            python_file: ./tasks/run_days.py
            parameters: [--slice, "{{job.parameters.slice}}", --days, "{{job.parameters.days}}", --calendar, "{{job.parameters.calendar}}",
                         --housekeeping-days, "{{job.parameters.housekeeping_days}}", --env, "${var.env}", --meta-instance,
                         "${var.meta_instance}", --run-id, "{{job.run_id}}", --root, "${workspace.file_path}"]
