# DataTwin scenario (G10), day 13: After a reader restart, the stream replays the last 45 minutes of readings.
# Oracle (world.yaml): no reading is counted twice; press-hour totals equal the world's truth
# FIXTURE note: the obs checks run on obs/fixture.py; ingestion and silver checks run on the engine when a
# run of it is attached (tests/dataplatform/test_twin_engine.py); gold checks too since W1d; DES checks are pending (W1e).
apiVersion: dwd-scenario/v0
scenario: stream-replayed
incident: stream-replayed
story: out_of_order
world: slices/02-tyre/world.yaml
discharges:
- DUP-04
- DPC-0086
- DPC-0096
- OPS-01
- OPS-06
checks:
- id: planted
  layer: world
  kind: planted
- id: shown
  layer: obs
  kind: on_dashboard
  dashboard: platform_health
  widget: steps_not_passed
  match:
    dataset: press_stream.press_reading
    step: detect.DUP-04
- id: one-alert
  layer: obs
  kind: one_alert
  rule: detector-fired
  subject: press_stream.press_reading/DUP-04
  fired_day: 13
  resolved_day: 14
- id: dedupe
  layer: silver
  kind: engine
  says: no reading is counted twice
  expect: verdict
  verdict: handled
- id: totals
  layer: gold
  kind: engine
  says: press-hour totals equal the world's truth
  expect: totals
  day: 13
