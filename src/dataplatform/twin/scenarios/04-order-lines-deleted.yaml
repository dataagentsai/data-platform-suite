# DataTwin scenario (G10), day 4: Hard-delete 5 cancelled order lines from day 1 at the source.
# Oracle (world.yaml): the 5 lines are marked deleted in silver, are gone from fact_otif and fact_sales, and OTIF
# equals the world's truth
# FIXTURE note: the obs checks run on obs/fixture.py; ingestion and silver checks run on the engine when a
# run of it is attached (tests/dataplatform/test_twin_engine.py); gold checks too since W1d; DES checks are pending (W1e).
apiVersion: dwd-scenario/v0
scenario: order-lines-deleted
incident: order-lines-deleted
story: deletes
world: slices/02-tyre/world.yaml
discharges:
- DEL-01
- DPC-0017
- DPC-0053
- OPS-01
- OPS-06
checks:
- id: planted
  layer: world
  kind: planted
- id: deleted-in-truth
  layer: world
  kind: oracle
  day: 4
  path:
  - silver
  - erp.sales_order_line
  - deleted_marked
  equals: 5
- id: shown
  layer: obs
  kind: on_dashboard
  dashboard: platform_health
  widget: steps_not_passed
  match:
    dataset: erp.sales_order_line
    step: detect.DEL-01
- id: one-alert
  layer: obs
  kind: one_alert
  rule: detector-fired
  subject: erp.sales_order_line/DEL-01
  fired_day: 4
  resolved_day: 5
- id: change-feed
  layer: ingestion
  kind: engine
  says: the change feed's deletes reach bronze for the 5 lines
  expect: verdict
  verdict: flagged
- id: marked
  layer: silver
  kind: engine
  says: the 5 lines are marked deleted in silver
  expect: verdict
  verdict: handled
- id: gone
  layer: gold
  kind: engine
  says: the 5 lines are gone from fact_otif and fact_sales, and OTIF equals the world's truth
  expect: verdict
  verdict: handled
